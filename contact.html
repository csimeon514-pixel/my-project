<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo-area">
    <div class="logo-mark">✏️✨</div>
    <h1>MarketMakers Studio</h1>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>
<main>
  <h2>Contact Us / Ask For A Design</h2>
  <p>Fill the form below. We will reply in 2 days.</p>
  <form id="inquiryForm">
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required placeholder="e.g. Mary Doe">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required placeholder="monique205@example.com">
    <label for="service">Which service do you need?</label>
    <select id="service" name="service">
      <option>Logo Design</option>
      <option>Poster & Flyer Design</option>
      <option>Social Media Marketing</option>
    </select>
    <label for="message">Your Idea / Message:</label>
    <textarea id="message" name="message" rows="4" required placeholder="Tell us your business name and what you want..."></textarea>
    <button type="submit" class="btn">Send Inquiry</button>
    <p id="formMsg"></p>
  </form>
  <p><strong>Studio:</strong> Monrovia, Liberia | <strong>Email:</strong> marketmakers@example.com</p>
</main>
